<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Tokscale token usage</title>
  <desc id="description"><!-- data:description -->60,253,135,829 lifetime tokens. Estimated cost $36,990. All-time cost rank #501. Daily token activity from Nov 23, 2025 to Nov 23, 2026, with 245 active days. Weeks start on Sunday. The four green shades show quartiles of nonzero daily token counts. Updated Nov 19, 2026 UTC.<!-- /data:description --></desc>
  <desc id="wide-light">Desktop, light appearance</desc>
  <desc id="wide-dark">Desktop, dark appearance</desc>
  <desc id="compact-light">Phone, light appearance</desc>
  <desc id="compact-dark">Phone, dark appearance</desc>
  <style>
    foreignObject {
      --canvas: #fff; --surface: #f6f8fa; --line: #d1d9e0; --ink: #1f2328; --muted: #59636e;
      --zero: #e9edf1; --low: #c4ddac; --mid: #93c76e; --high: #579342; --peak: #336b2c;
      --pad: 16px; --metrics: minmax(0, 1fr) auto auto; --metric-gap: 28px;
      --headline: 32px; --max-cell: 13px; --cal-direction: row;
    }
    :is(#wide-dark,#compact-dark):target ~ foreignObject {
      --canvas: #0d1117; --surface: #151b23; --line: #343d48; --ink: #f0f6fc; --muted: #a0aab4;
      --zero: #212830; --low: #234934; --mid: #39744a; --high: #6aa354; --peak: #a7d760;
    }
    :is(#compact-light,#compact-dark):target ~ foreignObject {
      --pad: 12px; --metrics: repeat(2,minmax(0,1fr)); --metric-gap: 10px;
      --primary-column: 1 / -1; --headline: 30px; --max-cell: 10px; --cal-direction: column; --half-flex: 0 0 auto;
    }
    * { box-sizing: border-box; }
    .panel {
      width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line); background: var(--canvas); color: var(--ink);
      font: 400 14px/1.4 "Mona Sans VF",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Backtick Fix","Noto Sans",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
      font-variant-numeric: tabular-nums;
    }
    .summary { display: grid; grid-template-columns: var(--metrics); align-items: start; gap: 8px var(--metric-gap);
      padding: 12px var(--pad); background: var(--surface); border-bottom: 1px solid var(--line); }
    .metric { display: flex; flex-direction: column; gap: 2px; }
    .metric span, .activity-count, .legend, .stamp { color: var(--muted); }
    .metric span { font-size: 13px; }
    .metric strong { font-size: 22px; line-height: 1.12; font-weight: 600; }
    .primary { grid-column: var(--primary-column,auto); }
    .primary strong { font-size: var(--headline); letter-spacing: -.025em; }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px var(--pad); }
    .heading, .foot, .legend, .source { display: flex; align-items: center; }
    .heading { justify-content: space-between; gap: 5px; }
    .heading strong { font-size: 14px; font-weight: 600; }
    .activity-count, .months, .foot { font-size: 12px; }
    .calendar { display: flex; flex-direction: var(--cal-direction); gap: 3px; margin-bottom: 14px; }
    .half { flex: var(--half-flex,var(--weeks) 1 0px); min-width: 0; }
    .months, .days { display: grid; grid-template-columns: repeat(var(--weeks),minmax(0,1fr)); column-gap: 3px; }
    .months { color: var(--muted); line-height: 16px; height: 18px; }
    .months span { grid-row: 1; white-space: nowrap; }
    .days { grid-template-rows: repeat(7,auto); grid-auto-flow: column; row-gap: 3px; justify-items: center; align-items: start; }
    .days i { width: min(100%,var(--max-cell)); aspect-ratio: 1; }
    .d0 { background: var(--zero); } .d1 { background: var(--low); } .d2 { background: var(--mid); }
    .d3 { background: var(--high); } .d4 { background: var(--peak); }
    .foot { gap: 10px; flex-wrap: wrap; margin-top: auto; line-height: 16px; }
    .legend { gap: 3px; margin-right: auto; }
    .legend i { width: 9px; height: 9px; }
    .legend span:first-child { margin-right: 2px; } .legend span:last-child { margin-left: 2px; }
    .source { gap: 4px; }
    .source svg { width: 12px; height: 12px; }
    :is(#compact-light,#compact-dark):target ~ foreignObject .foot { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
    :is(#compact-light,#compact-dark):target ~ foreignObject .stamp { grid-column: 1 / -1; grid-row: 2; }
    :is(#compact-light,#compact-dark):target ~ foreignObject .calendar { gap: 7px; }
  </style>
