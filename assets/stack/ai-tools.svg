    </symbol>
    <symbol id="coderabbit" viewBox="9 6 12 12">
      <path fill="currentColor" d="M24 13A12 12 0 1 0 2.2 20.4Q3.5 22.4 5.7 22.5C3.7 20.3 5.4 18.4 5.4 18.4 4.6 18.6 4.2 19.9 4.2 19.9 2.7 19 3.1 18 3.1 18 3 17.7 3.4 17 4.6 17.3 6.8 9.9 14.2 13.7 14.2 13.7L13.7 12.2C9 11.5 7.3 8 7.3 8 11.7 6.7 14.5 10.4 14.5 10.4 13.2 7.4 10.2 8.6 9.5 3.6 14.6 4.4 15.4 8.6 15.5 9.4Q15.3 9 17.7 9C20.3 9.2 22.4 11.9 22.4 11.9 22.4 17.4 15.8 16.1 15.8 20.2 15.8 21.2 16.8 21 17.2 21.5Q17.5 22.1 17.2 22.5H18Q20.3 22.5 21.7 20.5A12 12 0 0 0 24 13M15.6 22.5C14.4 22 13.3 19.5 11.9 19.5 14 20.7 13.1 22.2 13 22.5z" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="githubcopilot" viewBox="9 6 12 12">
      <path fill="currentColor" d="M24 17C23 18.5 18 22 12 22S1 18.5 0 17V13.7C.5 12.7 1.5 11.4 2.8 11L3.3 9.5V8.4Q3.2 6.4 4.3 5L6 4C7.3 3 9.2 2 11.9 2S16.8 3 18.2 4L19.6 5Q20.8 6.3 20.7 8.4V9.4L21.3 11C22.6 11.4 23.6 12.7 24 13.7zM12.1 11H11.8L11.5 11.5Q10.3 13 8 13 5.4 13 4.2 11.7H4V18.3C5.4 19.1 8.5 20.5 12 20.5S18.6 19.1 20 18.3V11.7H19.9Q18.5 13.1 16 13 13.7 13 12.5 11.5zM14.5 14.3Q15.4 14.3 15.5 15.3V17.3Q15.4 18.2 14.5 18.3A1 1 0 0 1 13.5 17.3V15.3Q13.6 14.3 14.5 14.3M9.5 14.3Q10.4 14.3 10.5 15.3V17.3Q10.4 18.2 9.5 18.3A1 1 0 0 1 8.5 17.3V15.3Q8.6 14.3 9.5 14.3M12.8 8Q13 9.7 13.7 10.6T16 11.6Q18.3 11.4 18.7 10.7 19.3 10 19.3 8.4T18.5 6Q18 5.3 15.7 5T13.2 5.5Q12.8 6 12.8 7.2zM11.2 8V7Q11.3 6.2 10.9 5.7 10.4 4.9 8.3 5 6 5.3 5.5 6 4.8 6.9 4.8 8.5T5.3 10.8C5.7 11.2 6.3 11.5 8 11.5Q9.8 11.5 10.3 10.5A5 5 0 0 0 11.2 8.2" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame">
      <section class="panel">
        <h3>AI Development Tools</h3>
        <div class="badges">
          <span class="badge" style="--edge:#d97757; --edge-dark:#d97757; --icon:#cc7052; --icon-dark:#d97757">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#anthropic" width="14" height="14"/></svg>
            <span>Claude Code</span>
          </span>
          <span class="badge" style="--edge:#d97757; --edge-dark:#d97757; --icon:#cc7052; --icon-dark:#d97757">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#anthropic" width="14" height="14"/></svg>
            <span>Claude Design</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-stacked break-phone"></span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-tbbrandopenai" width="14" height="14"/></svg>
            <span>Codex</span>
          </span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#cursor" width="14" height="14"/></svg>
            <span>Cursor</span>
          </span>
          <span aria-hidden="true" class="row-break break-phone"></span>
          <span class="badge" style="--edge:#ff570a; --edge-dark:#ff570a; --icon:#f05209; --icon-dark:#ff570a">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#coderabbit" width="14" height="14"/></svg>
            <span>CodeRabbit</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-stacked"></span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#opencode" width="14" height="14"/></svg>
            <span>OpenCode</span>
          </span>
          <span aria-hidden="true" class="row-break break-phone"></span>
          <span class="badge" style="--edge:#4d9abf; --edge-dark:#4d9abf; --icon:#4891b4; --icon-dark:#4d9abf">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#probot" width="14" height="14"/></svg>
            <span>Pi</span>
          </span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#githubcopilot" width="14" height="14"/></svg>
            <span>GitHub Copilot</span>
          </span>
        </div>
      </section>
    </div>
  </foreignObject>
</svg>
