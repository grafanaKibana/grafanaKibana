  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame">
      <section class="panel">
        <h3>Programming Languages</h3>
        <div class="badges">
          <span class="badge" style="--edge:#512bd4; --edge-dark:#ad93ff; --icon:#512bd4; --icon-dark:#ad93ff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-tbbrandcsharp" width="14" height="14"/></svg>
            <span>C#</span>
          </span>
          <span class="badge" style="--edge:#3776ab; --edge-dark:#3776ab; --icon:#3776ab; --icon-dark:#3776ab">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#python" width="14" height="14"/></svg>
            <span>Python</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-phone"></span>
          <span class="badge" style="--edge:#3178c6; --edge-dark:#3178c6; --icon:#3178c6; --icon-dark:#3178c6">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#typescript" width="14" height="14"/></svg>
            <span>TypeScript</span>
          </span>
          <span class="badge" style="--edge:#4169e1; --edge-dark:#4169e1; --icon:#4169e1; --icon-dark:#4169e1">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#postgresql" width="14" height="14"/></svg>
            <span>SQL</span>
          </span>
        </div>
      </section>
    </div>
  </foreignObject>
</svg>
