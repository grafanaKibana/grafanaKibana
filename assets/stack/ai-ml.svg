<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img">
  <title>AI / Machine Learning</title>
  <desc id="wide-light">Wide panel, light palette</desc>
  <desc id="wide-dark">Wide panel, dark palette</desc>
  <desc id="paired-light">Paired panel, light palette</desc>
  <desc id="paired-dark">Paired panel, dark palette</desc>
  <desc id="stacked-light">Stacked panel, light palette</desc>
  <desc id="stacked-dark">Stacked panel, dark palette</desc>
  <desc id="phone-light">Phone panel, light palette</desc>
  <desc id="phone-dark">Phone panel, dark palette</desc>
  <style>
    .frame, .panel, .badge { box-sizing: border-box; }
    .frame { height: 100%; padding-bottom: 8px; }
    .panel {
      height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 9px 10px;
      border: 1px solid #d1d9e0; background: #f6f8fa; color: #1f2328;
      font-family: "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    h3 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
    .badges {
      flex: 1; display: flex; flex-wrap: wrap; column-gap: 4px; align-content: space-between;
    }
    .badge {
      height: 32px; display: flex; flex: 1 1 0; min-width: max-content;
      align-items: center; justify-content: center; gap: 4px; padding-inline: 4px;
      font-size: 14px; line-height: 21px; font-weight: 500; white-space: nowrap;
      background: #fff; border: 1px solid color-mix(in srgb, var(--edge) 18%, #e9edf1);
    }
    .row-break { display: none; }
    :is(#wide-light, #wide-dark):target ~ foreignObject .break-wide,
    :is(#paired-light, #paired-dark):target ~ foreignObject .break-paired,
    :is(#stacked-light, #stacked-dark):target ~ foreignObject .break-stacked,
    :is(#phone-light, #phone-dark):target ~ foreignObject .break-phone {
      display: block; flex: 0 0 100%; height: 0;
    }
    @media (max-width: 305px) {
      .badge { gap: 2px; padding-inline: 2px; }
      .badge > svg { width: 12px; }
    }
    .badge svg { flex: none; color: var(--icon); }
    :is(#wide-dark, #paired-dark, #stacked-dark, #phone-dark):target ~ foreignObject .panel { color: #e6edf3; background: #151b23; border-color: #30363d; }
    :is(#wide-dark, #paired-dark, #stacked-dark, #phone-dark):target ~ foreignObject .badge { background: #0d1117; border-color: color-mix(in srgb, var(--edge-dark) 18%, #212830); }
    :is(#wide-dark, #paired-dark, #stacked-dark, #phone-dark):target ~ foreignObject .badge svg { color: var(--icon-dark); }
  </style>
  <defs>
    <symbol id="dotnet" viewBox="9 6 12 12">
      <path fill="currentColor" d="M24 8.8H21.5V16.3H20.1V8.8H17.6V7.5H24zM17.1 16.3H12.3V7.5H17V8.8H13.8V11.3H16.7V12.5H13.7V15.1H17.2zM10.4 16.3H9L4.8 10 4.5 9.4V16.3H3.2V7.5H4.8L8.8 14 9 14.4V7.5H10.4zM1.7 15.6A1 1 0 0 1 1 16.5 1 1 0 0 1 0 15.6 1 1 0 0 1 .9 14.8 1 1 0 0 1 1.7 15.6" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="ri-tbbrandopenai" viewBox="9 6 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.2 19.4A3.5 3.5 0 0 0 18 18.2V13L12 9.7" transform="matrix(.5 0 0 .5 9 6)"/>
      <path d="M5.2 15A3.5 3.5 0 0 0 9.7 20.3L14 17.7V10.8" transform="matrix(.5 0 0 .5 9 6)"/>
      <path d="M6 7.6Q3.7 7.3 2.5 9.3A3.5 3.5 0 0 0 3.7 14.1L8 16.6 14 13.2" transform="matrix(.5 0 0 .5 9 6)"/>
      <path d="M12.8 4.6A3.5 3.5 0 0 0 6 5.8V11L12 14.4" transform="matrix(.5 0 0 .5 9 6)"/>
      <path d="M18.8 9A3.5 3.5 0 0 0 14.3 3.7L10 6.3V13.2" transform="matrix(.5 0 0 .5 9 6)"/>
      <path d="M18 16.3Q20.3 16.6 21.5 14.6A3.5 3.5 0 0 0 20.3 10L16 7.4 10 10.8" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="databricks" viewBox="9 6 12 12">
      <path fill="currentColor" d="M1 14.2 12 20.4 22 14.9V17L12 22.7 1.5 16.7 1 17V17.8L12 24 23 17.8V13.5L22.6 13.2 12 19.2 2.1 13.4V11.3L12 16.8 23 10.6V6.3L22.6 6 12 12 2.6 6.7 12 1.4 19.8 5.8 20.4 5.3V4.8L12 0 1 6.3V7L12 13.2 22 7.7V9.9L12 15.5 1.5 9.5 1 10Z" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="ri-vscazure" viewBox="9 6 12 12">
      <path fill="currentColor" d="M15.4 13.7 11.4 1.7A1 1 0 0 0 10.4 1H5.6A1 1 0 0 0 4.6 1.7L.7 13.7A1 1 0 0 0 1.6 15H4.6A1 1 0 0 0 5.5 14.3L6.1 12.5 9.1 14.8 9.7 15H14.4A1 1 0 0 0 15.4 13.7M9.8 14.3H9.6L3.9 10H6.8V9.7L7.9 7.3 10 13.9A.3.3 0 0 1 9.8 14.3M14.4 14.3H10.7V13.7L6.7 1.7H10.4L10.7 1.9 14.7 14z" transform="matrix(.75 0 0 .75 9 6)"/>
    </symbol>
    <symbol id="ri-luactivity" viewBox="9 6 12 12">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 12H19.5A2 2 0 0 0 17.5 13.5L15.3 21.8H14.8L9.2 2.2H8.8L6.4 10.5A2 2 0 0 1 4.4 12H2" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame">
      <section class="panel">
        <h3>AI / Machine Learning</h3>
        <div class="badges">
          <span class="badge" style="--edge:#512bd4; --edge-dark:#ad93ff; --icon:#512bd4; --icon-dark:#ad93ff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#dotnet" width="14" height="14"/></svg>
            <span>Microsoft Agent Framework</span>
          </span>
          <span aria-hidden="true" class="row-break break-phone"></span>
          <span class="badge" style="--edge:#ff3621; --edge-dark:#ff3621; --icon:#ff3621; --icon-dark:#ff3621">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#databricks" width="14" height="14"/></svg>
            <span>RAG</span>
          </span>
          <span aria-hidden="true" class="row-break break-stacked"></span>
          <span class="badge" style="--edge:#512bd4; --edge-dark:#ad93ff; --icon:#512bd4; --icon-dark:#ad93ff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#dotnet" width="14" height="14"/></svg>
            <span>Microsoft.<wbr/>Extensions.<wbr/>AI</span>
          </span>
          <span aria-hidden="true" class="row-break break-paired break-phone"></span>
          <span class="badge" style="--edge:#512bd4; --edge-dark:#ad93ff; --icon:#512bd4; --icon-dark:#ad93ff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#dotnet" width="14" height="14"/></svg>
            <span>Semantic Kernel</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-stacked break-phone"></span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-tbbrandopenai" width="14" height="14"/></svg>
            <span>Large Language Models</span>
          </span>
          <span aria-hidden="true" class="row-break break-paired break-phone"></span>
          <span class="badge" style="--edge:#6b7280; --edge-dark:#8b949e; --icon:#18181b; --icon-dark:#fafafa">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-tbbrandopenai" width="14" height="14"/></svg>
            <span>LLM Evaluation</span>
          </span>
          <span aria-hidden="true" class="row-break break-stacked break-phone"></span>
          <span class="badge" style="--edge:#0078d4; --edge-dark:#0078d4; --icon:#0078d4; --icon-dark:#0078d4">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-vscazure" width="14" height="14"/></svg>
            <span>Azure AI Foundry</span>
          </span>
          <span class="badge" style="--edge:#4e9cff; --edge-dark:#4e9cff; --icon:#458be3; --icon-dark:#4e9cff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-luactivity" width="14" height="14"/></svg>
            <span>Langfuse</span>
          </span>
        </div>
      </section>
    </div>
  </foreignObject>
</svg>
