      <path fill="currentColor" d="M12 0A12 12 0 1 0 12 24 12 12 0 0 0 12 0M12 22.5C10.1 22.5 8.6 21.2 8.6 19.6H15.4C15.4 21.2 14 22.5 12 22.5M17.6 18.7H6.4V16.7H17.6zM17.6 15.7H6.4L6.3 15.4A8 8 0 0 1 4.6 12.6L8.2 13.4Q7.2 12 7.1 10.4C7.1 8 8.9 5.9 8.3 4.2Q9.3 4.3 9.7 7.6C10.4 6.6 10.7 4.9 10.7 3.8S11.3 1.4 12 1.4C11.5 2.4 12.3 3.4 13 5.7 13.3 6.5 13.2 7.9 13.4 8.9 13.5 6.9 13.8 4.2 15 3.2 14.5 4.4 15.1 6 15.5 6.7A6 6 0 0 1 16.6 10.4 5 5 0 0 1 15.5 13.4L16.8 13 19.4 12.6S19 14.1 17.6 15.6" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="kibana" viewBox="9 6 12 12">
      <path fill="currentColor" d="M2.6 0V21.6L21.4 0zM13.5 12.5 3.5 24H21A19 19 0 0 0 13.5 12.5" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
