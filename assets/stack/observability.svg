<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img">
  <title>Observability &amp; CI/CD</title>
  <desc id="wide-light">Wide panel, light palette</desc>
  <desc id="wide-dark">Wide panel, dark palette</desc>
  <desc id="stacked-light">Stacked panel, light palette</desc>
  <desc id="stacked-dark">Stacked panel, dark palette</desc>
  <style>
    .frame, .panel, .badge { box-sizing: border-box; }
    .frame { height: 100%; padding-bottom: 8px; }
    :is(#wide-light, #wide-dark):target ~ foreignObject .frame { padding-right: 5px; }
    .panel {
      height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 9px 10px;
      border: 1px solid #d1d9e0; background: #f6f8fa; color: #1f2328;
      font-family: "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    h3 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
    .badges {
      flex: 1; display: flex; flex-wrap: wrap; column-gap: 4px; align-content: space-between;
    }
    .badge {
      height: 32px; display: flex; flex: 1 1 0; min-width: max-content;
      align-items: center; justify-content: center; gap: 4px; padding-inline: 4px;
      font-size: 14px; line-height: 21px; font-weight: 500; white-space: nowrap;
      background: #fff; border: 1px solid color-mix(in srgb, var(--edge) 18%, #e9edf1);
    }
    .row-break { display: none; }
    :is(#wide-light, #wide-dark):target ~ foreignObject .break-wide,
    :is(#stacked-light, #stacked-dark):target ~ foreignObject .break-stacked {
      display: block; flex: 0 0 100%; height: 0;
    }
    @media (max-width: 305px) {
      .badge { gap: 2px; padding-inline: 2px; }
      .badge > svg { width: 12px; }
    }
    @media (max-width: 250px) {
      .panel { padding-inline: 6px; }
      .badge { font-size: 13px; }
    }
    .badge svg { flex: none; color: var(--icon); }
    :is(#wide-dark, #stacked-dark):target ~ foreignObject .panel { color: #e6edf3; background: #151b23; border-color: #30363d; }
    :is(#wide-dark, #stacked-dark):target ~ foreignObject .badge { background: #0d1117; border-color: color-mix(in srgb, var(--edge-dark) 18%, #212830); }
    :is(#wide-dark, #stacked-dark):target ~ foreignObject .badge svg { color: var(--icon-dark); }
  </style>
  <defs>
    <symbol id="grafana" viewBox="9 6 12 12">
