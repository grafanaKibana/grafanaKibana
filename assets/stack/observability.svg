      <path fill="currentColor" d="M15 3.6V12.1L11.5 15 6.1 13V15L3 11 12 11.7V4zM12 4 7 1V3L2.4 4.4 1 6V10.1L3 11.2V5.8z" transform="matrix(.75 0 0 .75 9 6)"/>
    </symbol>
    <symbol id="githubactions" viewBox="9 6 12 12">
      <path fill="currentColor" d="M11 13.8 10.6 13.7 10 12.9A.5.5 0 1 1 10.6 12.2L11 12.6 12.2 11.4A.5.5 0 0 1 12.9 12.3L11.3 13.7zM20.3 13.7 22 12.2A.5.5 0 0 0 21.2 11.5L20 12.5 19.6 12.2A.5.5 0 1 0 18.9 13L19.6 13.7zM4.5 7.5 7.1 5.9A1 1 0 0 0 7 4.2L4.5 2.6A1 1 0 0 0 3 3.4V6.6A1 1 0 0 0 4.5 7.5M6.5 5 4 6.6V3.4zM24 12.5C24 14.5 22.4 16 20.5 16A3.5 3.5 0 0 1 17 13H15A3.5 3.5 0 0 1 11.5 16 3.5 3.5 0 0 1 8 13H7.5Q5.9 13 5 12V17A3 3 0 0 0 8 20 3.5 3.5 0 1 1 11.5 24 3.5 3.5 0 0 1 8 21 4 4 0 0 1 4 17V9.9A5 5 0 0 1 0 5 5 5 0 0 1 10 5 5 5 0 0 1 5 10 2.5 2.5 0 0 0 7.5 12H8C8.3 10.3 9.7 9 11.5 9A3.5 3.5 0 0 1 15 12H17A3.5 3.5 0 0 1 20.5 9C22.5 9 24 10.6 24 12.5M9 20.5A2.5 2.5 0 1 0 14 20.5 2.5 2.5 0 0 0 9 20.5M5 9A4 4 0 1 0 5 1 4 4 0 0 0 5 9M14 12.5A2.5 2.5 0 1 0 9 12.5 2.5 2.5 0 0 0 14 12.5M23 12.5A2.5 2.5 0 1 0 18 12.5 2.5 2.5 0 0 0 23 12.5M10 20.5A.5.5 0 1 0 11 20.5.5.5 0 0 0 10 20.5M12 20.5A.5.5 0 1 0 13 20.5.5.5 0 0 0 12 20.5M24 20.5C24 22.5 22.4 24 20.5 24A3.5 3.5 0 0 1 17 21H16.5A.5.5 0 0 1 16.5 20H17A3.5 3.5 0 0 1 20.5 17C22.5 17 24 18.6 24 20.5M23 20.5A2.5 2.5 0 1 0 18 20.5 2.5 2.5 0 0 0 23 20.5" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
    <symbol id="gitlab" viewBox="9 6 12 12">
      <path fill="currentColor" d="M23.6 9.6 20.3 1 20 .6A1 1 0 0 0 19 .6L18.7 1.1 16.5 7.8H7.5L5.3 1.1 5 .6A1 1 0 0 0 4 .6L3.7 1 .4 9.5A6 6 0 0 0 2.4 16.7L7.5 20.4 10 22.2 11.4 23.3A1 1 0 0 0 12.6 23.3L14.1 22.3 16.6 20.2 21.6 16.7A6 6 0 0 0 23.6 9.6" transform="matrix(.5 0 0 .5 9 6)"/>
    </symbol>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame">
      <section class="panel">
        <h3>Observability &amp; CI/CD</h3>
        <div class="badges">
          <span class="badge" style="--edge:#f46800; --edge-dark:#f46800; --icon:#e36100; --icon-dark:#f46800">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#grafana" width="14" height="14"/></svg>
            <span>Grafana</span>
          </span>
          <span class="badge" style="--edge:#e6522c; --edge-dark:#e6522c; --icon:#e6522c; --icon-dark:#e6522c">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#prometheus" width="14" height="14"/></svg>
            <span>Prometheus</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-stacked"></span>
          <span class="badge" style="--edge:#c72f76; --edge-dark:#f04e98; --icon:#c72f76; --icon-dark:#f04e98">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#kibana" width="14" height="14"/></svg>
            <span>Kibana</span>
          </span>
          <span class="badge" style="--edge:#0078d7; --edge-dark:#0078d7; --icon:#0078d7; --icon-dark:#0078d7">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#ri-vscazuredevops" width="14" height="14"/></svg>
            <span>Azure DevOps</span>
          </span>
          <span aria-hidden="true" class="row-break break-wide break-stacked"></span>
          <span class="badge" style="--edge:#2088ff; --edge-dark:#2088ff; --icon:#2087fc; --icon-dark:#2088ff">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#githubactions" width="14" height="14"/></svg>
            <span>GitHub Actions</span>
          </span>
          <span class="badge" style="--edge:#fc6d26; --edge-dark:#fc6d26; --icon:#e06122; --icon-dark:#fc6d26">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><use href="#gitlab" width="14" height="14"/></svg>
            <span>GitLab CI/CD</span>
          </span>
        </div>
      </section>
    </div>
  </foreignObject>
</svg>
