  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame">
      <section class="panel">
        <h3>Data</h3>
        <div class="badges">
          <span class="badge" style="--edge:#cc2927; --edge-dark:#cc2927; --icon:#cc2927; --icon-dark:#cd2b29">
