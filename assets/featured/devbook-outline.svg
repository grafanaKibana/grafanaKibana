<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="46">
  <desc id="dark">Dark palette</desc>
  <defs>
    <radialGradient id="surface-light" cx=".5" cy="0" r=".84">
      <stop stop-color="#437100" stop-opacity=".12"/>
      <stop offset="1" stop-color="#437100" stop-opacity=".025"/>
    </radialGradient>
    <radialGradient id="surface-dark" href="#surface-light">
      <stop stop-color="#84cc16" stop-opacity=".15"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity=".035"/>
    </radialGradient>
  </defs>
  <style>
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    [id$="dark"]:target ~ .frame { fill: #151b23; stroke: #343d48; }
    .surface { x: 15px; width: calc(100% - 30px); }
    .label-offset { transform: translateX(0px); }
    .surface { color: #437100; fill: url(#surface-light); stroke: currentColor; stroke-opacity: .4; }
    .icon { color: #437100; }
    text { fill: #24292f; font: 500 14px/21px "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
    .content { transform-box: fill-box; transform: translateX(-50%); }
    [id$="dark"]:target ~ svg .surface { fill: url(#surface-dark); color: #84cc16; }
    [id$="dark"]:target ~ svg .icon { color: #a3d65c; }
    [id$="dark"]:target ~ svg text { fill: #e6edf3; }
    @media (max-width: 102px) {
      .content { transform: none; }
      .icon { transform: translate(-7px, 2px); }
      text { text-anchor: middle; transform: translate(-19px, 7px); }
    }
  </style>
  <g class="frame">
    <rect width="100%" height="46" stroke="none"/>
    <line x2="100%" y1="45.5" y2="45.5"/>
    <path d="M.5 0v46"/>
    <line class="right" x1="100%" x2="100%" y2="46" stroke-width="2"/>
  </g>
  <svg width="100%" height="46">
    <rect class="surface" y="1" height="30"/>
  </svg>
  <svg x="50%" overflow="visible">
    <g class="label-offset"><g class="content">
      <g class="icon" transform="translate(0 9)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3.5C5.5 2.4 3.5 2 1.5 2.6v8c2-.6 4-.2 5.5.9 1.5-1.1 3.5-1.5 5.5-.9v-8C10.5 2 8.5 2.4 7 3.5Zm0 .2v7.5"/>
      </g>
      <text x="19" y="20.5">devbook.zip</text>
    </g></g>
  </svg>
</svg>
