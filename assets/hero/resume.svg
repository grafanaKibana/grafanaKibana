<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" role="img" aria-labelledby="title">
  <title id="title">Download résumé</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .top { stop-color: #2e4517; }
      .base { stop-color: #192417; }
      .frame { stroke: #48515b; }
      .mark { color: #84cc16; }
      .caption { fill: #e6edf3; }
    }
    @media (min-width: 146px) {
      .mark { transform: translate(-68px, 14px); }
      .caption { font-size: 14px; text-anchor: middle; transform: translate(10px, 0); }
    }
    .reflection { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .reflection { opacity: .5; animation: sheen 12s ease-in-out infinite; }
      @keyframes sheen {
        0% { transform: translate(-115%, -18px) skewX(-24deg); }
        10%, 100% { transform: translate(115%, 18px) skewX(-24deg); }
      }
    }
    #light:target ~ defs .top { stop-color: #d8e1c9; }
    #light:target ~ defs .base { stop-color: #ecf1e6; }
    #light:target ~ .art .frame { stroke: #b4bdc6; }
    #light:target ~ .art .mark { color: #437100; }
    #light:target ~ .art .caption { fill: #24292f; }
    #dark:target ~ defs .top { stop-color: #2e4517; }
    #dark:target ~ defs .base { stop-color: #192417; }
    #dark:target ~ .art .frame { stroke: #48515b; }
    #dark:target ~ .art .mark { color: #84cc16; }
    #dark:target ~ .art .caption { fill: #e6edf3; }
  </style>
  <desc id="light">Light appearance</desc>
  <desc id="dark">Dark appearance</desc>
  <defs>
    <radialGradient id="wash" cx="50%" cy="-35%" r="125%">
      <stop class="top" stop-color="#d8e1c9"/>
      <stop class="base" offset="1" stop-color="#ecf1e6"/>
    </radialGradient>
    <radialGradient id="sheen">
      <stop stop-color="#fff9db" stop-opacity=".33"/>
      <stop offset=".44" stop-color="#fff4ca" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff4ca" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <svg class="art" y="1" width="100%" height="44" overflow="hidden">
    <rect class="frame" width="100%" height="100%" fill="url(#wash)" stroke="#b4bdc6" stroke-width="2"/>
    <g class="reflection" opacity="0"><ellipse cx="50%" cy="22" rx="45" ry="92" fill="url(#sheen)"/></g>
    <g class="mark" color="#437100" transform="translate(-8 3)"><svg x="50%" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></g>
    <text class="caption" x="50%" y="27" transform="translate(0 8)" text-anchor="middle" fill="#24292f"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500">Download résumé</text>
  </svg>
</svg>
