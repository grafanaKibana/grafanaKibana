<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" role="img" aria-labelledby="title">
  <title id="title">GitHub stars</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .top { stop-color: #0d1117; }
      .base { stop-color: #0d1117; }
      .frame { stroke: #48515b; }
      .mark { color: #e9b837; }
      .caption { fill: #e6edf3; }
    }
    @media (min-width: 152px) {
      .mark { transform: translate(-36px, 14px); }
      .caption { text-anchor: start; transform: translate(-14px, 0); }
    }
    #light:target ~ defs .top { stop-color: #ffffff; }
    #light:target ~ defs .base { stop-color: #ffffff; }
    #light:target ~ .art .frame { stroke: #b4bdc6; }
    #light:target ~ .art .mark { color: #9a6700; }
    #light:target ~ .art .caption { fill: #24292f; }
    #dark:target ~ defs .top { stop-color: #0d1117; }
    #dark:target ~ defs .base { stop-color: #0d1117; }
    #dark:target ~ .art .frame { stroke: #48515b; }
    #dark:target ~ .art .mark { color: #e9b837; }
    #dark:target ~ .art .caption { fill: #e6edf3; }
  </style>
  <desc id="light">Light appearance</desc>
  <desc id="dark">Dark appearance</desc>
  <defs>
    <radialGradient id="wash" cx="50%" cy="-35%" r="125%">
      <stop class="top" stop-color="#ffffff"/>
      <stop class="base" offset="1" stop-color="#ffffff"/>
    </radialGradient>
  </defs>
  <svg class="art" y="1" width="100%" height="44" overflow="hidden">
    <rect class="frame" width="100%" height="100%" fill="url(#wash)" stroke="#b4bdc6" stroke-width="2"/>
    <svg x="50%" width="1" height="44" overflow="visible">
      <g class="mark" color="#9a6700" transform="translate(-8 3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9z"/></svg></g>
      <text class="caption" y="27" transform="translate(0 8)" text-anchor="middle" fill="#24292f"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="14" font-weight="500">Stars <tspan font-weight="600" data-count="stars">22</tspan></text>
    </svg>
  </svg>
</svg>
