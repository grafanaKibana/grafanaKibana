<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" role="img" aria-labelledby="title">
  <title id="title">LeetCode</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .top { stop-color: #2f2517; }
      .base { stop-color: #151617; }
      .frame { stroke: #48515b; }
      .mark { color: #ffa116; }
      .caption { fill: #e6edf3; }
    }
    #light:target ~ defs .top { stop-color: #f5ede3; }
    #light:target ~ defs .base { stop-color: #fdfbf9; }
    #light:target ~ .art .frame { stroke: #b4bdc6; }
    #light:target ~ .art .mark { color: #a75e00; }
    #light:target ~ .art .caption { fill: #24292f; }
    #dark:target ~ defs .top { stop-color: #2f2517; }
    #dark:target ~ defs .base { stop-color: #151617; }
    #dark:target ~ .art .frame { stroke: #48515b; }
    #dark:target ~ .art .mark { color: #ffa116; }
    #dark:target ~ .art .caption { fill: #e6edf3; }
  </style>
  <desc id="light">Light appearance</desc>
  <desc id="dark">Dark appearance</desc>
  <defs>
    <radialGradient id="wash" cx="50%" cy="-35%" r="125%">
      <stop class="top" stop-color="#f5ede3"/>
      <stop class="base" offset="1" stop-color="#fdfbf9"/>
    </radialGradient>
  </defs>
  <svg class="art" y="2" width="100%" height="44" overflow="hidden">
    <rect class="frame" x="2.5" y=".5" width="calc(100% - 5px)" height="43" fill="url(#wash)" stroke="#b4bdc6" stroke-width="1"/>
    <g class="mark" color="#a75e00" transform="translate(-42 14)"><svg x="50%" viewBox="13 8 16 16" width="16" height="16" fill="currentColor"><path fill="currentColor" d="M13.5 0A1 1 0 0 0 12.5.4L7.1 6.2 3.3 10.4A5 5 0 0 0 2 12.4L1.9 13A6 6 0 0 0 2 15.3L2.4 16.3A6 6 0 0 0 3.6 18.2L8 22.4A6 6 0 0 0 16 22.4L18.5 19.8Q19 19 18.4 18A1.4 1.4 0 0 0 16.4 18L14 20.5A3 3 0 0 1 9.8 20.4L5.5 16.2A3 3 0 0 1 4.5 13.9L4.8 13.4 5.3 12.2 9 8.2C10.1 7 12.3 6.7 13.6 7.7L17 10.7Q18 11.4 19 10.5A1.4 1.4 0 0 0 18.8 8.5L15.3 5.7Q14 4.7 12.5 4.5L14.5 2.3A1.4 1.4 0 0 0 13.5 0M10.6 12.8A1.4 1.4 0 0 0 9.2 14.2 1.4 1.4 0 0 0 10.6 15.6H20.8A1.4 1.4 0 0 0 22.2 14.2 1.4 1.4 0 0 0 20.8 12.8z" transform="translate(13 8)scale(.66667)" /></svg></g>
    <text class="caption" x="50%" y="27" transform="translate(11 0)" text-anchor="middle" fill="#24292f"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="14" font-weight="500">LeetCode</text>
  </svg>
</svg>
