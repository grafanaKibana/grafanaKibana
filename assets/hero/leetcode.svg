<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" role="img">
  <title>LeetCode</title>
  <style>
    .button {
      box-sizing: border-box; width: calc(100% - 4px); height: calc(100% - 2px); margin: 2px 2px 0 2px;
      --brand: #a75e00;
      --ink: #24292f;
      --edge: #76839066;
      --wash: 11%;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 4px 6px; border: 1px solid var(--edge); color: var(--ink);
      background-color: color-mix(in srgb, var(--brand) 3%, transparent);
      background-image: radial-gradient(ellipse 80% 130% at 50% -35%, color-mix(in srgb, var(--brand) var(--wash), transparent), transparent);
    }
    #dark:target ~ foreignObject .button {
      --brand: #ffa116; --ink: #e6edf3; --edge: #8c959f55; --wash: 15%;
    }
    .icon { color: var(--brand); }
    .label { font: 500 14px/21px "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; white-space: nowrap; }
    .icon, .label { display: block; flex: none; }
    .compact { display: none; }
    @media (max-width: 110px) {
      .button { flex-direction: column; gap: 2px; padding: 2px; }
    }
    @media (max-width: 74px) {
      .full { display: none; }
      .compact { display: block; }
    }
  </style>
  <desc id="dark">Dark appearance</desc>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="button">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="13 8 16 16" width="16" height="16" fill="currentColor"><path fill="currentColor" d="M13.5 0A1 1 0 0 0 12.5.4L7.1 6.2 3.3 10.4A5 5 0 0 0 2 12.4L1.9 13A6 6 0 0 0 2 15.3L2.4 16.3A6 6 0 0 0 3.6 18.2L8 22.4A6 6 0 0 0 16 22.4L18.5 19.8Q19 19 18.4 18A1.4 1.4 0 0 0 16.4 18L14 20.5A3 3 0 0 1 9.8 20.4L5.5 16.2A3 3 0 0 1 4.5 13.9L4.8 13.4 5.3 12.2 9 8.2C10.1 7 12.3 6.7 13.6 7.7L17 10.7Q18 11.4 19 10.5A1.4 1.4 0 0 0 18.8 8.5L15.3 5.7Q14 4.7 12.5 4.5L14.5 2.3A1.4 1.4 0 0 0 13.5 0M10.6 12.8A1.4 1.4 0 0 0 9.2 14.2 1.4 1.4 0 0 0 10.6 15.6H20.8A1.4 1.4 0 0 0 22.2 14.2 1.4 1.4 0 0 0 20.8 12.8z" transform="translate(13 8)scale(.66667)" /></svg>
      <span class="label full">LeetCode</span>
      <span class="label compact">Code</span>
    </div>
  </foreignObject>
</svg>
