<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="46" role="img">
  <title>GitHub profile statistics</title>
  <desc id="followers-light">Followers, light theme</desc>
  <desc id="followers-dark">Followers, dark theme</desc>
  <desc id="stars-light">Stars, light theme</desc>
  <desc id="stars-dark">Stars, dark theme</desc>
  <style>
    .metric {
      --border: #a6b0b9; --label: #475569; --value: #1f2328; --star: #9a6700;
      box-sizing: border-box; height: 100%; display: none;
      flex-wrap: wrap; align-content: center; align-items: center; justify-content: center;
      gap: 0 5px; color: var(--label);
      border: 1px solid var(--border);
      font: 500 14px/21px "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif,
        "Apple Color Emoji", "Segoe UI Emoji";
      white-space: nowrap;
    }
    [id$="-dark"]:target ~ foreignObject .metric {
      --border: #4b5561; --label: #b7c1cb; --value: #f0f6fc; --star: #e9b837;
    }
    [id^="followers-"]:target ~ foreignObject .followers,
    [id^="stars-"]:target ~ foreignObject .stars { display: flex; }
    .metric svg { flex: none; }
    .stars svg { color: var(--star); }
    .value { color: var(--value); font-variant-numeric: tabular-nums; }
    @media (max-width: 116px) {
      .metric { column-gap: 3px; }
      .metric svg { width: 14px; }
    }
    @media (max-width: 104px) {
      .metric span:not(.value) { order: 1; flex-basis: 100%; text-align: center; }
    }
  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="metric followers">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="9" cy="8" r="3"/><path d="M2 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 4 5v1"/>
      </svg>
      <span>Followers</span><span class="value" data-count="followers">7</span>
    </div>
    <div xmlns="http://www.w3.org/1999/xhtml" class="metric stars">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9z"/>
      </svg>
      <span>Stars</span><span class="value" data-count="stars">22</span>
    </div>
  </foreignObject>
</svg>
