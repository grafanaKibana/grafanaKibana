<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" role="img">
  <title>LinkedIn</title>
  <style>
    .button {
      box-sizing: border-box; width: calc(100% - 2px); height: calc(100% - 2px); margin: 2px 2px 0 0px;
      --brand: #0a66c2;
      --ink: #24292f;
      --edge: #76839066;
      --wash: 11%;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 4px 6px; border: 1px solid var(--edge); color: var(--ink);
      background-color: color-mix(in srgb, var(--brand) 3%, transparent);
      background-image: radial-gradient(ellipse 80% 130% at 50% -35%, color-mix(in srgb, var(--brand) var(--wash), transparent), transparent);
    }
    #dark:target ~ foreignObject .button {
      --brand: #55a6ec; --ink: #e6edf3; --edge: #8c959f55; --wash: 15%;
    }
    .icon { color: var(--brand); }
    .label { font: 500 14px/21px "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; white-space: nowrap; }
    .icon, .label { display: block; flex: none; }
    .compact { display: none; }
    @media (max-width: 110px) {
      .button { flex-direction: column; gap: 2px; padding: 2px; }
    }
    @media (max-width: 65px) {
      .full { display: none; }
      .compact { display: block; }
    }
  </style>
  <desc id="dark">Dark appearance</desc>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="button">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="13 8 16 16" width="16" height="16" fill="currentColor"><path fill="currentColor" d="M416 32H31.9A32 32 0 0 0 0 64.3V447.7A32 32 0 0 0 31.9 480H416C433.6 480 448 465.5 448 447.7V64.3A32 32 0 0 0 416 32M135.4 416H69V202.2H135.5zM102.2 173A38.5 38.5 0 1 1 102.2 96 38.5 38.5 0 0 1 102.2 173M384.3 416H317.9V312C317.9 287.2 317.4 255.3 283.4 255.3 248.8 255.3 243.5 282.3 243.5 310.2V416H177.1V202.2H240.8V231.4H241.7C250.6 214.6 272.3 196.9 304.6 196.9 371.8 196.9 384.3 241.2 384.3 298.8z" transform="translate(13 8)scale(.03125)" /></svg>
      <span class="label full">LinkedIn</span>
      <span class="label compact">Profile</span>
    </div>
  </foreignObject>
</svg>
