    #dark:target ~ defs .top { stop-color: #172635; }
    #dark:target ~ defs .base { stop-color: #10161e; }
    #dark:target ~ .art .frame { stroke: #48515b; }
    #dark:target ~ .art .mark { color: #55a6ec; }
